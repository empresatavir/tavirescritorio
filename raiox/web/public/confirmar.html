<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmar e-mail · Raio X TAVIR</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="confirm">
    <h1>Confirmar e-mail</h1>
    <p data-state="idle">Confirme que este e-mail é seu para a análise do Raio X começar. O resultado será enviado para ele.</p>
    <button type="button" data-confirm>Confirmar meu e-mail</button>
    <p data-state="ok" hidden>E-mail confirmado. Pode fechar esta página.</p>
    <p data-state="error" hidden>Este link expirou ou já foi usado. Fale com quem enviou o convite para receber outro.</p>
  </main>
  <script src="/confirmar.js"></script>
</body>
</html>
